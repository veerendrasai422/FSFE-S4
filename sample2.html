
<!DOCTYPE html>
<html>
<head>
    <title>FoodieHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            background: #fffaf5;
        }

        header {
            background: #e85d04;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
            background: #ffe5d0;
        }

        .hero h1 {
            font-size: 40px;
            color: #9d3200;
        }

        .hero p {
            margin: 20px;
        }

        button {
            background: #e85d04;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        .menu {
            text-align: center;
            padding: 40px;
        }

        .food-card {
            display: inline-block;
            background: white;
            width: 230px;
            margin: 15px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ddd;
        }

        .food-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 10px;
        }

        .food-card h3 {
            margin: 10px;
        }

        .food-card p {
            margin: 10px;
        }

        footer {
            background: #9d3200;
            color: white;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h2>FoodieHub 🍔</h2>

    <nav>
        <a href="#home">Home</a>
        <a href="#menu">Menu</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="hero" id="home">
    <h1>Delicious Food, Delivered Fresh!</h1>
    <p>Enjoy your favourite food at your doorstep.</p>
    <button onclick="document.getElementById('menu').scrollIntoView()">
        Order Now
    </button>
</section>

<section class="menu" id="menu">

    <h1>Our Special Menu</h1>

    <div class="food-card">
        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" alt="Burger">
        <h3>Cheese Burger</h3>
        <p>₹149</p>
        <button>Order Now</button>
    </div>

    <div class="food-card">
     <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500" alt="Pizza">
        <h3>Pizza</h3>
        <p>₹249</p>
        <button>Order Now</button>
    </div>

    <div class="food-card">
        <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=500" alt="Salad">
        <h3>Fresh Salad</h3>
        <p>₹129</p>
        <button>Order Now</button>
    </div>

</section>

<footer id="contact">
    <p>Contact: foodiehub@gmail.com</p>
    <p>© 2026 FoodieHub. All Rights Reserved.</p>
</footer>

</body>
</html>
