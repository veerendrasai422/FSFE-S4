
<!DOCTYPE html>
<html>
<head>
    <title>Student Learning Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
            background: #dbeafe;
        }

        .hero h1 {
            color: #172554;
            font-size: 40px;
        }

        .hero p {
            margin: 20px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        .courses {
            padding: 50px;
            text-align: center;
        }

        .card {
            display: inline-block;
            background: white;
            padding: 30px;
            margin: 15px;
            width: 220px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        footer {
            background: #172554;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h2>LearnHub</h2>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#courses">Courses</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="hero" id="home">
    <h1>Welcome to LearnHub</h1>
    <p>Learn HTML, CSS and JavaScript with us!</p>
    <button>Explore Courses</button>
</section>

<section class="courses" id="courses">
    <h1>Our Courses</h1>

    <div class="card">
        <h2>HTML</h2>
        <p>Learn website structure.</p>
    </div>

    <div class="card">
        <h2>CSS</h2>
        <p>Design beautiful websites.</p>
    </div>

    <div class="card">
        <h2>JavaScript</h2>
        <p>Make websites interactive.</p>
    </div>
</section>

<footer id="contact">
    <p>Contact: learnhub@gmail.com</p>
    <p>© 2026 LearnHub</p>
</footer>

</body>
</html>
